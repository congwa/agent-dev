<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分层时间轮 · 可视化</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#272b35; --txt:#e6e8ee; --dim:#8b93a7;
    --a:#5b9cf8;  /* 第一层 */
    --b:#f2b544;  /* 第二层 */
    --c:#c084f5;  /* 第三层 */
    --ok:#3ecf8e; --hot:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:24px;line-height:1.6}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px}
  button{background:#232734;color:var(--txt);border:1px solid var(--line);border-radius:7px;
    padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{background:#2c3140}
  button.primary{background:var(--a);border-color:var(--a);color:#08111f;font-weight:600}
  input[type=number]{width:70px;background:#0d0f14;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
  .clock{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;
    background:#0d0f14;border:1px solid var(--line);border-radius:7px;padding:6px 12px}
  .sep{width:1px;height:22px;background:var(--line)}
  .wheels{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .wheel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;flex:1;min-width:280px}
  .wheel h3{margin:0;font-size:14px}
  .wheel .meta{color:var(--dim);font-size:12px;margin-bottom:6px}
  svg{display:block;width:100%;height:auto}
  .ptr{transition:transform .25s cubic-bezier(.4,1.4,.5,1);transform-origin:130px 130px}
  .cols{display:flex;gap:16px;flex-wrap:wrap}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;flex:1;min-width:300px}
  .box h3{margin:0 0 10px;font-size:14px}
  #log{height:260px;overflow-y:auto;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
  #log div{padding:3px 0;border-bottom:1px solid #1e222b;color:var(--dim)}
  #log b{color:var(--txt);font-weight:600}
  .t-add{color:var(--a)!important}.t-down{color:var(--b)!important}.t-fire{color:var(--ok)!important}
  #tasks{font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:260px;overflow-y:auto}
  #tasks div{padding:4px 0;border-bottom:1px solid #1e222b;display:flex;justify-content:space-between;gap:8px}
  .tag{border-radius:4px;padding:1px 6px;font-size:11px}
  .empty{color:var(--dim);font-size:12.5px}
  .tip{color:var(--dim);font-size:12px;margin-top:14px;border-left:2px solid var(--line);padding-left:10px}
</style>
</head>
<body>

<h1>分层时间轮（Hierarchical Timing Wheel）</h1>
<div class="sub">加一个任务，看它落进哪一格、怎么一层层"降级"下来、最后怎么走到指针底下被执行。</div>

<div class="bar">
  <span class="clock">t = <span id="now">0</span> s</span>
  <button id="play" class="primary">▶ 自动走</button>
  <button id="step">⏭ 走一格</button>
  <button id="reset">↺ 重置</button>
  <span class="sep"></span>
  <span style="font-size:13px">添加任务：<b>延迟</b></span>
  <input type="number" id="delay" value="20" min="1" max="500">
  <span style="font-size:13px">秒</span>
  <button id="add">+ 下单</button>
  <button id="demo">载入示例</button>
</div>

<div class="wheels" id="wheels"></div>

<div class="cols">
  <div class="box"><h3>待触发任务</h3><div id="tasks"></div></div>
  <div class="box"><h3>事件日志</h3><div id="log"></div></div>
</div>

<div class="tip">
  规则：任务只会被放进"能装得下它"的<b>最低层</b>。上层格子到期时不执行任务，而是把里面的任务<b>重新插入</b>下层——
  此时它的剩余时间一定小于下层一圈，所以必定装得下。指针每次只碰一格，与总任务数无关。
</div>

<script>
const CFG=[
  {name:'第一层 · 秒轮', tick:1,  size:8, color:'--a'},
  {name:'第二层 · 分轮', tick:8,  size:8, color:'--b'},
  {name:'第三层 · 时轮', tick:64, size:8, color:'--c'},
];
let wheels, now, tasks, seq, timer=null, rot=[];

function init(){
  now=0; seq=0; tasks=[];
  wheels=CFG.map(c=>({...c, buckets:Array.from({length:c.size},()=>[])}));
  rot=CFG.map(()=>0);
  render(); logEl.innerHTML=''; log('时钟归零，时间轮就绪','');
}

/* ---------- 核心：插入 ---------- */
function insert(task, reason){
  for(let li=0; li<wheels.length; li++){
    const w=wheels[li], span=w.tick*w.size;
    const cur=Math.floor(now/w.tick)*w.tick;      // 本层当前时间（向下取整到格）
    if(task.exp < cur+span){                       // 装得下 → 就放这层
      const vid=Math.floor(task.exp/w.tick);       // 虚拟格号
      const idx=vid%w.size;                        // 环形取模 = 真实格号
      w.buckets[idx].push(task);
      task.at=[li,idx];
      log(`${reason} <b>${task.id}</b>(到期 t=${task.exp}) → 第${li+1}层[${idx}] 格`, reason==='降级'?'t-down':'t-add');
      return;
    }
  }
  log(`<b>${task.id}</b> 超出最外层范围（>${wheels.at(-1).tick*wheels.at(-1).size}s），忽略`,'');
}

/* ---------- 核心：指针走一格 ---------- */
function tick(){
  now++;
  // 从最外层往内层检查：哪些层刚好走到一个新格子
  for(let li=wheels.length-1; li>=1; li--){
    const w=wheels[li];
    if(now % w.tick===0){
      const idx=Math.floor(now/w.tick)%w.size;
      const list=w.buckets[idx]; w.buckets[idx]=[];
      if(list.length) log(`第${li+1}层指针 → [${idx}]，取出 ${list.length} 个任务准备降级`,'t-down');
      list.forEach(t=> t.exp<=now ? fire(t) : insert(t,'降级'));
    }
  }
  // 第一层：这一格里的任务全部到期，直接执行
  const w0=wheels[0], i0=now%w0.size;
  const list=w0.buckets[i0]; w0.buckets[i0]=[];
  list.forEach(fire);
  render();
}
function fire(t){
  tasks=tasks.filter(x=>x!==t);
  log(`⏰ <b>${t.id}</b> 到期，执行关单 (t=${now})`,'t-fire');
}

/* ---------- 渲染 ---------- */
const $=id=>document.getElementById(id), logEl=$('log');
function log(html,cls){
  const d=document.createElement('div'); if(cls)d.className=cls;
  d.innerHTML=`<span style="opacity:.55">t=${String(now).padStart(3)}</span>  ${html}`;
  logEl.prepend(d);
}
function render(){
  $('now').textContent=now;
  $('wheels').innerHTML=wheels.map((w,li)=>{
    const cur=Math.floor(now/w.tick)%w.size;
    const deg=cur*(360/w.size);
    // 保证指针只顺时针转，不倒回去
    while(rot[li]%360!==deg) rot[li]= (Math.floor(rot[li]/360))*360+deg + (deg<rot[li]%360?360:0);
    const slots=w.buckets.map((b,i)=>{
      const a=(-90+i*(360/w.size))*Math.PI/180;
      const x=130+95*Math.cos(a), y=130+95*Math.sin(a);
      const on=i===cur, has=b.length>0;
      return `<circle cx="${x}" cy="${y}" r="23"
                fill="${has?`var(${w.color})`:'#1d212a'}" fill-opacity="${has?.9:1}"
                stroke="${on?`var(${w.color})`:'#2c313d'}" stroke-width="${on?3:1.5}"/>
              <text x="${x}" y="${y-4}" text-anchor="middle" font-size="11"
                fill="${has?'#0d0f14':'#6c7488'}" font-weight="700">${i}</text>
              ${has?`<text x="${x}" y="${y+9}" text-anchor="middle" font-size="10.5"
                fill="#0d0f14" font-weight="700">${b.length}个</text>`:''}`;
    }).join('');
    return `<div class="wheel">
      <h3 style="color:var(${w.color})">${w.name}</h3>
      <div class="meta">每格 ${w.tick}s · 共 ${w.size} 格 · 一圈 ${w.tick*w.size}s · 指针在 [${cur}]</div>
      <svg viewBox="0 0 260 260">
        <circle cx="130" cy="130" r="95" fill="none" stroke="#232833" stroke-width="1.5"
          stroke-dasharray="3 5"/>
        ${slots}
        <g class="ptr" style="transform:rotate(${rot[li]}deg)">
          <line x1="130" y1="130" x2="130" y2="52" stroke="var(${w.color})" stroke-width="3"
            stroke-linecap="round"/>
          <polygon points="130,44 124,58 136,58" fill="var(${w.color})"/>
        </g>
        <circle cx="130" cy="130" r="5" fill="var(${w.color})"/>
      </svg></div>`;
  }).join('');

  $('tasks').innerHTML = tasks.length? tasks.map(t=>{
    const [li,idx]=t.at;
    return `<div><span><b style="color:var(${wheels[li].color})">${t.id}</b>
      <span style="opacity:.6">到期 t=${t.exp}</span></span>
      <span class="tag" style="background:var(${wheels[li].color});color:#0d0f14">第${li+1}层[${idx}]</span></div>`;
  }).join('') : '<div class="empty">暂无任务，点「+ 下单」试试</div>';
}

/* ---------- 交互 ---------- */
$('add').onclick=()=>{
  const d=Math.max(1,Math.min(500,+$('delay').value||1));
  const t={id:'订单'+(++seq), exp:now+d}; tasks.push(t); insert(t,'新增'); render();
};
$('step').onclick=tick;
$('play').onclick=e=>{
  if(timer){clearInterval(timer);timer=null;e.target.textContent='▶ 自动走';e.target.classList.add('primary');}
  else{timer=setInterval(tick,700);e.target.textContent='⏸ 暂停';e.target.classList.remove('primary');}
};
$('reset').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ 自动走';$('play').classList.add('primary');}init();};
$('demo').onclick=()=>{
  [3,7,20,45,140].forEach(d=>{const t={id:'订单'+(++seq),exp:now+d};tasks.push(t);insert(t,'新增');});
  render();
};
init();
</script>
</body>
</html>
